function parseDelimited(text){

 for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))result.push(row);row=[];cell=''}else cell+=c}
 if(quoted)throw Error('Close the quoted cell before importing.');row.push(cell.trim());if(row.some(Boolean))result.push(row);return result;
}
function mapInventory(matrix){
 if(!matrix.length)throw Error('Paste at least one item.');if(matrix.length>501)throw Error('Import up to 500 items at a time.');
 const aliases={name:['item','name','title','product','description'],sku:['sku','id','stock id'],qty:['qty','quantity','units'],offer:['cost','buy','purchase price','paid'],ask:['asking','ask','price','asking price','sell','selling price'],minimum:['minimum','min','floor','minimum price'],category:['category'],condition:['condition'],location:['location','pickup area','city']};
 const header=matrix[0].map(x=>String(x).toLowerCase().trim());const map=Object.fromEntries(Object.entries(aliases).map(([k,a])=>[k,header.findIndex(x=>a.includes(x))]));const hasHeader=map.name>=0;
 return (hasHeader?matrix.slice(1):matrix).filter(a=>a.some(x=>String(x).trim())).map(a=>{const r={name:'',sku:'',qty:1,offer:0,ask:0,minimum:0,category:'',condition:'',location:intakePolicy.location,photo:'',policy:intakePolicy.mode};if(!hasHeader){r.name=a.join(', ');return r}Object.entries(map).forEach(([k,i])=>{if(i<0||a[i]===undefined||String(a[i]).trim()==='')return;const value=String(a[i]).trim();r[k]=['qty','offer','ask','minimum'].includes(k)?Number(value.replace(/[$,]/g,'')):value});return r});
}
function intakeDuplicate(r,index){const key=r.sku.trim().toLowerCase();return key?stockRows().some(x=>x.sku?.trim().toLowerCase()===key)||intake.slice(0,index).some(x=>x.sku.trim().toLowerCase()===key):stockRows().some(x=>x.name.toLowerCase()===r.name.toLowerCase()&&x.location===r.location)||intake.slice(0,index).some(x=>x.name.toLowerCase()===r.name.toLowerCase()&&x.location===r.location)}
function intakeInvalid(r){return !r.name.trim()||!Number.isInteger(r.qty)||r.qty<1||['offer','ask','minimum'].some(k=>!Number.isFinite(r[k])||r[k]<0)||r.minimum>r.ask}
function openIntake(){
 settings=true;settingsTitle='Add inventory';$('#mp-settings').innerHTML='<div class="inv-intake"><label class="inv-label">Paste inventory<textarea id="inv-paste" rows="4" placeholder="Item, Qty, Cost, Asking, Minimum, Category, Condition\nOak chair, 2, 40, 80, 60, Furniture, Good"></textarea></label><div class="inv-bulk"><button type="button" class="mp-small-button" id="inv-preview">Preview rows</button><label class="mp-small-button">Upload CSV or Excel<input id="inv-file" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls"></label></div><p class="mp-settings-note">Paste spreadsheet rows or one item per line. Use your computer’s dictation in the text box. No AI transcription is connected.</p><div id="inv-error" role="alert"></div><div id="inv-preview-rows"></div><div class="mp-settings-footer"><button class="mp-action" type="button" id="inv-import" disabled>Add items</button><button class="mp-small-button" id="inv-cancel" type="button">Cancel</button></div></div>';render();
 $('#inv-cancel').onclick=()=>{settings=false;render()};$('#inv-preview').onclick=()=>{try{intake=mapInventory(parseDelimited($('#inv-paste').value));intakeError='';renderIntakeRows()}catch(e){$('#inv-error').textContent=e.message}};
 $('#inv-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;importBusy=true;$('#inv-import').disabled=true;try{if(file.size>5e6)throw Error('Choose a file under 5 MB.');let matrix;if(/\.xlsx?$/i.test(file.name)){if(!globalThis.XLSX)throw Error('Excel reader unavailable. Export CSV or paste your spreadsheet rows.');const book=XLSX.read(await file.arrayBuffer(),{type:'array'});matrix=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''});}else matrix=parseDelimited(await file.text());intake=mapInventory(matrix);intakeError='';}catch(e){intakeError=e.message}finally{importBusy=false;if($('#inv-preview-rows'))renderIntakeRows()}};
 $('#inv-import').onclick=()=>{if(importBusy||!intake.length||intake.some(intakeInvalid))return;let added=0,skipped=0;intake.forEach((r,i)=>{if(intakeDuplicate(r,i)){skipped++;return}const id=Math.max(...rows.map(x=>x.id))+1;const item={...r,id,sku:r.sku||'INV-'+id,stockTracked:true,view:'Stock',resale:r.ask,costs:0,url:'',detail:'',status:'Stored'};rows.push(item);runInventory(item);added++});settings=false;view='Stock';category='All';render();feedback(added+(added===1?' item added. ':' items added. ')+skipped+' duplicates skipped. Publishing is simulated.');intake=[]};renderIntakeRows();
}
function renderIntakeRows(){
 $('#inv-error').textContent=intakeError;$('#inv-import').disabled=importBusy||!intake.length||intake.some(intakeInvalid);$('#inv-import').textContent='Add '+intake.filter((r,i)=>!intakeDuplicate(r,i)).length+(intake.filter((r,i)=>!intakeDuplicate(r,i)).length===1?' item':' items');
 $('#inv-preview-rows').innerHTML=intake.length?'<div class="inv-bulk"><label>Workflow<select id="inv-intake-mode">'+modeOptions(intake[0]?.policy||intakePolicy.mode)+'</select></label></div><div class="inv-scroll"><table class="inv-table"><thead><tr>'+invFields.map(x=>'<th>'+x[1]+'</th>').join('')+'<th>Photo</th><th>Workflow</th><th>Check</th><th></th></tr></thead><tbody>'+intake.map((r,i)=>'<tr>'+invFields.map(([k,l,t])=>'<td>'+invInput(r,k,l,t,i)+'</td>').join('')+'<td><label>'+(photos[r.photo]?'Attached':'Add photo')+'<input type="file" accept="image/jpeg,image/png,image/webp" data-photo-index="'+i+'" aria-label="Photo '+(i+1)+'"></label></td><td><select aria-label="Workflow '+(i+1)+'" data-row-mode="'+i+'">'+modeOptions(r.policy)+'</select></td><td>'+esc(intakeDuplicate(r,i)?'Duplicate: skipped':intakeInvalid(r)?'Fix values':r.policy!=='store'&&invMissing(r).length?'Needs '+invMissing(r).join(', '):'Ready')+'</td><td><button class="mp-small-button" type="button" data-remove-intake="'+i+'" aria-label="Remove row '+(i+1)+'">Remove</button></td></tr>').join('')+'</tbody></table></div>':'';
 $$('[data-inv-field]').forEach(el=>{el.oninput=()=>{intake[+el.dataset.index][el.dataset.invField]=el.type==='number'?(el.value===''?NaN:Number(el.value)):el.value.trim();$('#inv-import').disabled=importBusy||!intake.length||intake.some(intakeInvalid)};el.onchange=renderIntakeRows});
 $$('[data-row-mode]').forEach(el=>el.onchange=()=>{intake[+el.dataset.rowMode].policy=el.value;renderIntakeRows()});
 $$('[data-remove-intake]').forEach(el=>el.onclick=()=>{intake.splice(+el.dataset.removeIntake,1);renderIntakeRows()});
 $$('[data-photo-index]').forEach(el=>el.onchange=async()=>{const file=el.files[0];if(!file)return;const r=intake[+el.dataset.photoIndex];importBusy=true;$('#inv-import').disabled=true;try{r.photo=await readInventoryPhoto(file);intakeError=''}catch(e){intakeError=e.message}finally{importBusy=false;if($('#inv-preview-rows'))renderIntakeRows()}});
 if($('#inv-intake-mode'))$('#inv-intake-mode').onchange=()=>{const mode=$('#inv-intake-mode').value;intake.forEach(r=>r.policy=mode);renderIntakeRows()};
}
async function readInventoryPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5e6)throw Error('Use a JPG, PNG, or WebP under 5 MB.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not read photo.'));reader.readAsDataURL(file)});await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('This photo could not be opened. Choose another image.'));img.src=data});const key='inventory-photo-'+Date.now()+'-'+Math.random().toString(36).slice(2);photos[key]=data;return key}
function openStockEdit(r){
 settings=true;settingsTitle='Edit inventory';$('#mp-settings').innerHTML='<form id="inv-edit"><div class="mp-fields">'+invFields.map(([k,l,t])=>'<label>'+l+'<input name="'+k+'" type="'+t+'" value="'+esc(r[k]??'')+'"'+(t==='number'?' min="'+(k==='qty'?1:0)+'" step="'+(k==='qty'?1:'.01')+'"':'')+(k==='name'||t==='number'?' required':'')+'></label>').join('')+'<label>Workflow<select name="policy">'+modeOptions(r.policy)+'</select></label><label>Photo<input type="file" id="inv-edit-photo" accept="image/jpeg,image/png,image/webp"></label></div><p id="inv-edit-error" role="alert"></p><button class="mp-action" type="submit">Save item</button><button class="mp-small-button" id="inv-cancel" type="button">Cancel</button></form>';render();$('#inv-cancel').onclick=()=>{settings=false;render()};$('#inv-edit').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),next={...r};invFields.forEach(([k,l,t])=>next[k]=t==='number'?Number(f.get(k)):f.get(k).trim());next.policy=f.get('policy');if(intakeInvalid(next)){$('#inv-edit-error').textContent='Check quantity and prices. Minimum cannot exceed asking price.';return}if(next.sku&&stockRows().some(x=>x!==r&&x.sku.toLowerCase()===next.sku.toLowerCase())){$('#inv-edit-error').textContent='This SKU already exists.';return}const button=e.target.querySelector('[type="submit"]');button.disabled=true;try{const file=$('#inv-edit-photo').files[0];if(file)next.photo=await readInventoryPhoto(file);if($('#item-specifications')){Object.assign(next,{specifications:$('#item-specifications').value.trim(),accessories:$('#item-accessories').value.trim(),pricingStrategy:$('#pricing-strategy').value,costKnown:$('#pricing-cost-known').checked&&f.get('offer')!==''});if(!next.costKnown)next.offer=0;}Object.assign(r,next);r.resale=r.ask;if(r.view==='Selling')workFor(r).floor=r.minimum;runInventory(r);settings=false;render();feedback('Item saved. Eligible automation resumed in the demo.')}catch(err){$('#inv-edit-error').textContent=err.message;button.disabled=false}};
}
function openInventoryBackup(){
 settings=true;settingsTitle='Inventory backup';const payload=JSON.stringify({version:1,policy:intakePolicy,items:stockRows().map(r=>({...r,photoData:photos[r.photo]||null}))},null,2);
 $('#mp-settings').innerHTML='<button class="mp-action" type="button" id="inv-download">Download backup</button><label class="inv-label">Backup JSON<textarea id="inv-backup-text" rows="8" readonly></textarea></label><p class="mp-settings-note">Download or copy this JSON. Restore adds inventory as stored items; it never publishes or restores conversations.</p><label class="inv-label">Restore JSON file<input id="inv-restore" type="file" accept=".json"></label><p id="inv-backup-error" role="alert"></p><button class="mp-small-button" id="inv-cancel" type="button">Done</button>';render();$('#inv-backup-text').value=payload;$('#inv-download').hidden=window.self!==window.top;$('#inv-download').onclick=()=>{const url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='vector-inventory-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#inv-backup-text').onclick=e=>e.target.select();$('#inv-cancel').onclick=()=>{settings=false;render()};$('#inv-restore').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>25e6)throw Error('Backup must be under 25 MB.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.items)||data.items.length>500)throw Error('Unsupported backup.');const clean=data.items.map(x=>{const r={};invFields.forEach(([k,l,t])=>r[k]=t==='number'?x[k]:String(x[k]??''));if(intakeInvalid(r))throw Error('Backup contains invalid inventory.');return {...r,photoData:typeof x.photoData==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x.photoData)?x.photoData:null}});let added=0;clean.forEach(x=>{if(stockRows().some(r=>r.sku===x.sku&&x.sku))return;const id=Math.max(...rows.map(r=>r.id))+1,key='restored-'+id;if(x.photoData)photos[key]=x.photoData;delete x.photoData;rows.push({...x,id,photo:key,stockTracked:true,policy:'store',view:'Stock',resale:x.ask,costs:0,url:'',detail:''});added++});settings=false;render();feedback(added+(added===1?' item restored as stored inventory.':' items restored as stored inventory.'))}catch(err){if($('#inv-backup-error'))$('#inv-backup-error').textContent=err.message}};
}

render();$$('[data-boot]').forEach(b=>{b.disabled=false;b.removeAttribute('data-boot')});if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(design,'accent',{label:'Interface light',reference:'--mp-accent'});tweak.addSelect(design,'density',{label:'Spacing',options:['Comfortable','Compact']});const coreTweak=new Tweak({container:coreElement,onChange:()=>{syncCoreMotion();icons()}});coreTweak.addSelect(coreDesign,'shape',{label:'Core texture',options:['Nebula','Lattice']});coreTweak.addToggle(coreDesign,'motion',{label:'Animate core'});}
})();
