@container (max-width:850px){#marketplace-flight-deck .mp-shell{grid-template-columns:105px minmax(0,1fr)}#marketplace-flight-deck .mp-nav{padding:20px 5px}#marketplace-flight-deck .mp-nav button{gap:7px;font-size:12px;padding:12px 8px}#marketplace-flight-deck .mp-body{grid-template-columns:minmax(0,1fr) 238px;gap:12px}#marketplace-flight-deck .mp-row{grid-template-columns:64px minmax(0,1fr);gap:9px;padding:11px}#marketplace-flight-deck .mp-thumb{height:64px}#marketplace-flight-deck .mp-row-price{grid-column:2;text-align:left;display:flex;gap:12px;font-size:13px}#marketplace-flight-deck .mp-row-price small{margin:0}#marketplace-flight-deck .mp-row-name{font-size:13px}#marketplace-flight-deck .mp-row-sub{font-size:11px}#marketplace-flight-deck .mp-heading{flex-wrap:wrap}#marketplace-flight-deck .mp-location{display:none}}

@container(max-width:620px){#marketplace-flight-deck .mp-auto-top>.mp-orbit{display:none}#marketplace-flight-deck .mp-auto-heading{flex-basis:100%}#marketplace-flight-deck .mp-auto-top .mp-action{flex:1}#marketplace-flight-deck .mp-auto-path{gap:7px;font-size:11px}}

function coreTick(now){

}
