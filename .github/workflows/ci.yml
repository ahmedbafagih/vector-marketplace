name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/privacy_check.py
      - run: python3 build.py
      - run: npm test
      - name: Native self-test
        run: VECTOR_DATA_DIR="$(mktemp -d)" "build/Marketplace AI.app/Contents/MacOS/Vector" --self-test
      - name: Package preview
        run: ditto -c -k --sequesterRsrc --keepParent "build/Marketplace AI.app" build/Marketplace-AI-macOS-preview.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Marketplace-AI-macOS-testing-preview
          path: |
            build/Marketplace-AI-macOS-preview.zip
            build/Marketplace-AI-*.zip
            build/release.json
          retention-days: 14
